apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-server
  namespace: securerepo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-server
  template:
    metadata:
      labels:
        app: langfuse-server
    spec:
      containers:
      - name: langfuse-server
        image: langfuse/langfuse:2.95.0
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: DATABASE_URL
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: NEXTAUTH_SECRET
        - name: NEXT_PUBLIC_LANGFUSE_CLOUD_REGION
          value: "default"
        - name: SALT
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: SALT
        - name: ENCRYPT_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: ENCRYPT_KEY
        - name: LANGFUSE_INIT_USER_EMAIL
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_USER_EMAIL
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_USER_PASSWORD
        - name: LANGFUSE_INIT_USER_NAME
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_USER_NAME
        - name: HOST_URL
          value: "http://langfuse:3090"
        - name: NEXTAUTH_URL
          value: "http://localhost:3090"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/public/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/public/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: securerepo
spec:
  type: ClusterIP
  selector:
    app: langfuse-server
  ports:
  - name: http
    port: 3090
    targetPort: 3000
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-lb
  namespace: securerepo
spec:
  type: LoadBalancer
  selector:
    app: langfuse-server
  ports:
  - name: http
    port: 3090
    targetPort: 3000
