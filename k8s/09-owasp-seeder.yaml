---
# OWASP Seeder ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: owasp-seeder-config
  namespace: securerepo
data:
  QDRANT_URL: "http://qdrant:6333"
  EMBEDDING_URL: "http://embedding:8080"
  ENABLE_NESTED_SCANNING: "true"
  MAX_DEPTH: "2"
  MAX_PAGES_PER_DOMAIN: "50"
  FOLLOW_EXTERNAL_LINKS: "true"
  HTTP_TIMEOUT: "180"
  PAGES_JSON: '["https://scs.owasp.org/sctop10","https://top10.owasp.org//2025/A01_2025-Broken_Access_Control","https://top10.owasp.org//2025/A02_2025-Security_Misconfiguration","https://top10.owasp.org//2025/A03_2025-Software_Supply_Chain_Failures","https://top10.owasp.org//2025/A04_2025-Cryptographic_Failures","https://top10.owasp.org//2025/A05_2025-Injection","https://top10.owasp.org//2025/A06_2025-Insecure_Design","https://top10.owasp.org//2025/A07_2025-Authentication_Failures","https://top10.owasp.org//2025/A08_2025-Software_or_Data_Integrity_Failures","https://top10.owasp.org//2025/A09_2025-Security_Logging_and_Alerting_Failures"]'
---
# OWASP Seeder Service
apiVersion: v1
kind: Service
metadata:
  name: owasp-seeder
  namespace: securerepo
spec:
  type: ClusterIP
  ports:
  - port: 8004
    targetPort: 8004
  selector:
    app: owasp-seeder
---
# OWASP Seeder Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owasp-seeder
  namespace: securerepo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: owasp-seeder
  template:
    metadata:
      labels:
        app: owasp-seeder
    spec:
      nodeSelector:
        node: node-app
      containers:
      - name: owasp-seeder
        image: xravil/securerepo-owasp-seeder:v0.0.1-amd64
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
        envFrom:
        - configMapRef:
            name: owasp-seeder-config
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
