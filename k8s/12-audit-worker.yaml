---
# Audit Worker ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-worker-config
  namespace: securerepo
data:
  KAFKA_BROKER: "kafka:9092"
  QDRANT_URL: "http://qdrant:6333"
  EMBEDDING_URL: "http://embedding:8080/embed"
  LLM_MODEL: "qwen2.5-coder-7b-instruct-abliterated:q4_k_m"
  HTTP_TIMEOUT: "240"
  EMBEDDING_TIMEOUT: "240"
  # Guardrails Configuration - Only run essential checks
  GUARDRAILS_ENABLED_CHECKS: '["json_validation", "grounding_check", "explanation_quality", "duplicate_detection"]'
  GUARDRAILS_ENABLED: "true"
  GUARDRAILS_STRICT_MODE: "false"
---
# Audit Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-worker
  namespace: securerepo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-worker
  template:
    metadata:
      labels:
        app: audit-worker
    spec:
      nodeSelector:
        node: node-audit
      containers:
      - name: audit-worker
        image: xravil/securerepo-audit-worker:v0.0.5-amd64
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: audit-worker-config
        env:
        - name: OAPI_API_KEY
          valueFrom:
            secretKeyRef:
              name: oapi-secret
              key: OAPI_TOKEN
        - name: OAPI_MODELS_URL
          valueFrom:
            secretKeyRef:
              name: oapi-secret
              key: OAPI_MODELS_URL
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_URL
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: SECUREREPO_SECRET_KEY  # Swapped: secret has pk- value
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: SECUREREPO_PUBLIC_KEY  # Swapped: secret has sk- value
        - name: LANGFUSE_HOST
          value: "http://langfuse:3090"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
