services:
  # Simplified Docker Compose for troubleshooting - removes strict health checks

  # Keycloak (simplified)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: securerepo-keycloak
    ports:
      - "8180:8080"
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    volumes:
      - ./keycloak_data:/opt/keycloak/data/h2
    networks:
      - securerepo

  # Qdrant (no health check for now)
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: securerepo-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - securerepo

  # Kafka (no health check)
  kafka:
    image: apache/kafka:3.7.0
    container_name: securerepo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    networks:
      - securerepo

  # PostgreSQL (keep healthcheck)
  postgres:
    image: postgres:16.2
    container_name: securerepo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: securerepo
      POSTGRES_PASSWORD: securerepo_pass
      POSTGRES_DB: securerepo
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - securerepo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securerepo || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Embedding Service
  embedding:
    build: ./services/embedding-service
    container_name: securerepo-embedding
    ports:
      - "8080:8080"
    environment:
      - MODEL_NAME=BAAI/bge-m3
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - securerepo
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # API Service
  api:
    build: ./services/api-service
    container_name: securerepo-api
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BROKER=kafka:9092
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_URL=postgresql://securerepo:securerepo_pass@postgres:5432/securerepo
      - KEYCLOAK_URL=http://keycloak:8180
    networks:
      - securerepo
    # Removed strict health check dependencies
    depends_on:
      - kafka
      - qdrant
      - postgres
      - keycloak
      - embedding

  # Frontend Service
  frontend:
    build: ./services/frontend-service
    container_name: securerepo-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
      - KEYCLOAK_URL=http://keycloak:8080
      - BROWSER_KEYCLOAK_URL=http://localhost:8180
      - KEYCLOAK_REALM=securerepo
      - KEYCLOAK_CLIENT_ID=securerepo-api
      - KEYCLOAK_CLIENT_SECRET=securerepo-secret
    networks:
      - securerepo
    depends_on:
      - api
      - keycloak

  # Internal Rules Ingestion Service
  internal-rules-ingestion:
    build: ./services/internal-rules-ingestion
    container_name: securerepo-internal-rules-ingestion
    ports:
      - "8001:8001"
    env_file:
      - ./services/internal-rules-ingestion/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_URL=http://embedding:8080
      - MAX_WORKERS=8
      - QDRANT_MAX_RETRIES=10
      - QDRANT_BACKOFF_BASE=1.0
      - QDRANT_BACKOFF_MAX=30.0
      - HTTP_MAX_RETRIES=10
      - HTTP_BACKOFF_BASE=1.0
      - HTTP_BACKOFF_MAX=30.0
      - HTTP_TIMEOUT=240
      - EMBEDDING_TIMEOUT=240
    networks:
      - securerepo
    depends_on:
      - qdrant
      - embedding

  # OWASP Seeder
  owasp-seeder:
    build: ./services/owasp-seeder
    container_name: securerepo-owasp-seeder
    ports:
      - "8004:8004"
    env_file:
      - ./services/owasp-seeder/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_URL=http://embedding:8080
      - ENABLE_NESTED_SCANNING=true
      - MAX_DEPTH=2
      - MAX_PAGES_PER_DOMAIN=50
      - FOLLOW_EXTERNAL_LINKS=true
      - HTTP_TIMEOUT=180
    networks:
      - securerepo
    depends_on:
      - qdrant
      - embedding

  # Indexer Service
  indexer:
    build: ./services/indexer-service
    container_name: securerepo-indexer
    ports:
      - "8002:8002"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_URL=http://embedding:8080
      - KAFKA_BROKER=kafka:9092
      - HTTP_TIMEOUT=240
      - EMBEDDING_TIMEOUT=240
    networks:
      - securerepo
    depends_on:
      - qdrant
      - kafka
      - embedding

  # Audit Worker
  audit-worker:
    build: ./services/audit-worker
    container_name: securerepo-audit-worker
    env_file:
      - ./services/audit-worker/.env
    environment:
      - KAFKA_BROKER=kafka:9092
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_URL=http://embedding:8080/embed
      - POSTGRES_URL=postgresql://securerepo:securerepo_pass@postgres:5432/securerepo
      - FOUNDATION_MODELS_URL=https://foundation-models.api.cloud.ru/v1
      - LLM_MODEL=Qwen/Qwen3-Coder-Next
      - HTTP_TIMEOUT=240
      - EMBEDDING_TIMEOUT=240
    networks:
      - securerepo
    depends_on:
      - kafka
      - qdrant
      - postgres
      - embedding

  # Kafka Monitor
  kafka-monitor:
    image: confluentinc/cp-kafka:7.5.0
    container_name: securerepo-kafka-monitor
    command: sleep infinity
    networks:
      - securerepo
    depends_on:
      - kafka

networks:
  securerepo:
    driver: bridge

volumes:
  qdrant_data:
  kafka_data:
  postgres_data: