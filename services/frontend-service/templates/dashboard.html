<!DOCTYPE html>

<head>

    <style>

            margin: 0;
            padding: 0;

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

<body>
    <div class="header">
        <h1>🔒 SecureRepo</h1>
        <div>
            <span class="user" id="userInfo">Загрузка...</span>
            <a href="/login" class="logout">Выйти</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>🚀 Безопасность репозиториев</h2>
                <button class="btn" onclick="openNewAuditModal()">➕ Новый аудит</button>
            </div>

            <div class="audit-list" id="auditList">
                <p>Загрузка аудитов...</p>
            </div>
        </div>
    </div>

<div class="modal-bg" id="newAuditModal">
    <div class="modal-content-wrapper">
        <h2>🎯 Запуск аудита</h2>
        <form id="auditForm">
            <div class="form-group">
                <label>📂 URL репозитория</label>
                <input type="text" name="repo_url" placeholder="https://github.com/user/repo" required>
            </div>
            <div class="form-group">
                <label>🌿 Ветка</label>
                <input type="text" name="branch" value="main">
            </div>
            <div class="form-group">
                <label>💻 Язык программирования</label>
                <select name="lang">
                    <option value="python">Python</option>
                    <option value="go">Go</option>
                    <option value="javascript">JavaScript</option>
                    <option value="typescript">TypeScript</option>
                    <option value="java">Java</option>
                    <option value="all">Все языки</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">❌ Отмена</button>
                <button type="submit" class="btn">🔥 Запустить аудит</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-bg" id="reportModal">
    <div class="modal-content-wrapper lg">
        <div id="reportContent">
            <div class="loading">⏳ Загрузка отчёта...</div>
        </div>
    </div>
</div>

<script>
        const API_URL = "{{API_URL}}";

        function getToken() {
            return localStorage.getItem('access_token');
        }

        function getUserInfo() {
            const token = getToken();
            console.log('getUserInfo called, token exists:', !!token);

            if (!token) {
                console.error('❌ No token found in getUserInfo');
                return null;
            }

            try {
                const parts = token.split('.');
                console.log('🔍 Token parts count:', parts.length);

                if (parts.length !== 3) {
                    console.error('❌ Invalid token format, expected 3 parts but got:', parts.length);
                    return null;
                }

                const payload = parts[1];
                console.log('🔍 Payload length:', payload.length);

                const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
                const padding = 4 - base64.length % 4;
                const paddedBase64 = base64 + (padding !== 4 ? '='.repeat(padding) : '');

                console.log('✅ Base64URL to Base64 conversion done');

                const decoded = atob(paddedBase64);
                const payload_data = JSON.parse(decoded);

                console.log('✅ Successfully decoded and parsed JWT payload');
                console.log('📋 User ID (sub):', payload_data.sub);

                if (!payload_data.sub) {
                    console.error('❌ Token payload missing "sub" field');
                    return null;
                }

                const userInfo = {
                    sub: payload_data.sub,
                    roles: payload_data.realm_access?.roles || []
                };

                console.log('✅ User info successfully extracted:', userInfo);
                return userInfo;
            } catch (e) {
                console.error('❌ Error parsing token:', e);
                console.error('Error details:', e.message);
                return null;
            }
        }

        let currentUser = null;

        async function loadAudits() {
            const token = getToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const response = await fetch('/api/audits', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                const list = document.getElementById('auditList');
                if (!data.items || data.items.length === 0) {
                    list.innerHTML = '<p>Нет аудитов. Создайте первый аудит 🎯</p>';
                    return;
                }

                list.innerHTML = data.items.map(audit => `
                    <div class="audit-item ${audit.status === 'completed' ? 'clickable' : ''}" ${audit.status === 'completed' ? `onclick="viewAudit('${audit.audit_id}')"` : ''}>
                        <div class="info">
                            <h3>📂 ${audit.repo_url}</h3>
                            <p>📅 ${new Date(audit.created_at).toLocaleString()}</p>
                        </div>
                        <span class="status status-${audit.status}">
                            ${audit.status === 'completed' ? `${audit.status} 👁️` : audit.status}
                        </span>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
                document.getElementById('auditList').innerHTML = '<p>❌ Ошибка загрузки аудитов</p>';
            }
        }

        function openNewAuditModal() {
            document.getElementById('newAuditModal').classList.add('active');
        }

        function closeModal() {
            const newAuditModal = document.getElementById('newAuditModal');
            newAuditModal.classList.remove('active');
            newAuditModal.style.display = 'none';
        }

        document.getElementById('auditForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const token = getToken();

            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const response = await fetch('/api/audits/start', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        repo_url: formData.get('repo_url'),
                        branch: formData.get('branch'),
                        lang: formData.get('lang')
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    closeModal();
                    loadAudits();
                } else {
                    alert('❌ Ошибка: ' + (data.detail || 'Неизвестная ошибка'));
                }
            } catch (e) {
                alert('❌ Ошибка запуска аудита');
            }
        });

        /**
         * Генерирует правильный URL к файлу в репозитории
         * 
         * @param {string} repoUrl - URL репозитория (например, https://github.com/ravblk/auth)
         * @param {string} branch - Ветка репозитория (например, main, master, dev)
         * @param {string} filePath - Локальный путь к файлу (например, /tmp/repos/UUID/internal/services/users/users.go)
         * @returns {string} - Готовый URL
         */
        function generateRepositoryUrl(repoUrl, branch, filePath) {
            if (!repoUrl || !filePath || !branch) return '';
        
            // Удаляем локальную часть пути /tmp/repos/<uuid>/
            // Регулярка ищет начало пути /tmp/repos/ и следующую за ним папку (UUID), оставляя только путь внутри репозитория
            const cleanFilePath = filePath.replace(/^\/tmp\/repos\/[^\/]+\//, '').replace(/^\//, '');
        
            try {
                const url = new URL(repoUrl);
                const cleanBasePath = url.pathname.replace(/\/+$/, ''); // Убираем trailing slash
        
                if (url.hostname.includes('gitlab.com')) {
                    // GitLab формат
                    url.pathname = `${cleanBasePath}/-/blob/${branch}/${cleanFilePath}`;
                } else {
                    // По умолчанию GitHub формат (работает и для других сервисов)
                    url.pathname = `${cleanBasePath}/blob/${branch}/${cleanFilePath}`;
                }
        
                return url.toString();
            } catch (e) {
                // Fallback: простой формат, если URL некорректный
                const cleanRepoUrl = repoUrl.replace(/\/+$/, '');
                if (repoUrl.includes('gitlab.com')) {
                    return `${cleanRepoUrl}/-/blob/${branch}/${cleanFilePath}`;
                }
                return `${cleanRepoUrl}/blob/${branch}/${cleanFilePath}`;
            }
        }

        async function viewAudit(auditId) {
            const token = getToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const reportModal = document.getElementById('reportModal');
                const reportContent = document.getElementById('reportContent');
                reportContent.innerHTML = '<div class="loading">⏳ Загрузка отчёта аудита...</div>';

                reportModal.classList.add('active');

                const statusResponse = await fetch(`/api/audits/${auditId}/status`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!statusResponse.ok) {
                    throw new Error(`Ошибка получения статуса: ${statusResponse.status}`);
                }

                const statusData = await statusResponse.json();

                // Сохраняем repo_url для генерации ссылок
                window.currentRepoUrl = statusData.repo_url;

                if (statusData.status !== 'completed') {
                    const statusMessages = {
                        'running': '🔄 Аудит выполняется',
                        'pending': '⏳ Аудит ожидает запуска',
                        'failed': '❌ Аудит завершился с ошибкой'
                    };

                    reportContent.innerHTML = `
                        <h2>📊 Статус аудита</h2>
                        <div class="report-details">
                            <p><strong>🆔 Идентификатор:</strong> ${auditId}</p>
                            <p><strong>📂 Репозиторий:</strong> ${statusData.repo_url}</p>
                            <p><strong>📊 Статус:</strong> <span class="status status-${statusData.status}">${statusData.status}</span></p>
                            <p><strong>📅 Создан:</strong> ${new Date(statusData.created_at).toLocaleString()}</p>
                        </div>
                        <div style="text-align: center; padding: 20px;">
                            <h3>${statusMessages[statusData.status] || statusData.status}</h3>
                            <p style="color: #a0a0a0;">Отчёт будет доступен после завершения аудита</p>
                        </div>
                        <div class="modal-actions">
                            <button class="btn btn-secondary" onclick="closeReportModal()">❌ Закрыть</button>
                        </div>
                    `;
                    return;
                }

                const reportResponse = await fetch(`/api/audits/${auditId}/report`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!reportResponse.ok) {
                    throw new Error(`Ошибка получения отчёта: ${reportResponse.status}`);
                }

                const reportData = await reportResponse.json();

                showAuditReport(auditId, statusData, reportData);

            } catch (e) {
                console.error('Error loading audit report:', e);
                const reportModal = document.getElementById('reportModal');
                const reportContent = document.getElementById('reportContent');

                reportContent.innerHTML = `
                    <h2>❌ Ошибка загрузки</h2>
                    <div style="text-align: center; padding: 20px;">
                        <p>Не удалось загрузить данные аудита</p>
                        <p style="color: #a0a0a0; font-size: 14px;">${escapeHtml(e.message || 'Неизвестная ошибка')}</p>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="closeReportModal()">❌ Закрыть</button>
                    </div>
                `;
            }
        }

        function showAuditReport(auditId, statusData, reportData) {
            console.log('Showing audit report:', reportData);

            const reportModal = document.getElementById('reportModal');
            const reportContent = document.getElementById('reportContent');

            let findings = [];

            if (reportData.findings && Array.isArray(reportData.findings)) {
                findings = reportData.findings;
                console.log(`✅ Got ${findings.length} findings from reportData.findings`);
            }
            else if (reportData.results && Array.isArray(reportData.results)) {
                reportData.results.forEach(chunk => {
                    if (chunk.findings && Array.isArray(chunk.findings)) {
                        chunk.findings.forEach(violation => {
                            findings.push({
                                ...violation,
                                file_path: violation.file_path || chunk.file_path
                            });
                        });
                    }
                });
                console.log(`✅ Got ${findings.length} findings from reportData.results (transformed)`);
            }

            let reportHtml = `
                <h2>📊 Отчёт аудита</h2>
                <div class="report-details">
                    <p><strong>🆔 Идентификатор:</strong> ${auditId}</p>
                    <p><strong>📂 Репозиторий:</strong> ${statusData.repo_url}</p>
                    <p><strong>📊 Статус:</strong> <span class="status status-${statusData.status}">${statusData.status}</span></p>
                    <p><strong>📅 Создан:</strong> ${new Date(statusData.created_at).toLocaleString()}</p>
                    <p><strong>🔍 Всего находок:</strong> ${findings.length}</p>
                </div>
                <div class="report-findings">
                    <h3>🎯 Результаты проверки:</h3>
            `;

            if (findings.length > 0) {
                const findingsBySeverity = {
                    critical: findings.filter(f => f.severity?.toLowerCase() === 'critical'),
                    high: findings.filter(f => f.severity?.toLowerCase() === 'high'),
                    medium: findings.filter(f => f.severity?.toLowerCase() === 'medium'),
                    low: findings.filter(f => f.severity?.toLowerCase() === 'low'),
                    info: findings.filter(f => !f.severity || f.severity?.toLowerCase() === 'info')
                };

                const severityOrdering = ['critical', 'high', 'medium', 'low', 'info'];

                for (const severity of severityOrdering) {
                    const severityFindings = findingsBySeverity[severity];
                    if (severityFindings && severityFindings.length > 0) {
                        reportHtml += `<div class="severity-section severity-${severity}">
                            <h4>${severity.charAt(0).toUpperCase() + severity.slice(1)} (${severityFindings.length})</h4>`;
                        severityFindings.forEach(finding => {
                            const severityClass = `finding-${finding.severity?.toLowerCase() || 'info'}`;
                            reportHtml += `
                                <div class="finding-item ${severityClass}">
                                    <div class="finding-header">
                                        <span class="status status-${finding.severity?.toLowerCase() || 'info'}">${finding.severity || 'Info'}</span>
                                        <div class="finding-message">${finding.message || finding.explanation || '🔍 Сообщение проблемы'}</div>
                                        ${finding.file_path ? `<span class="file-path">${finding.file_path}${finding.line_number ? `:${finding.line_number}` : ''}</span>` : ''}
                                    </div>

                                    ${finding.code_snippet || finding.vulnerable_line ? `
                                    <div class="finding-details">
                                        <div class="code-snippet">${escapeHtml(finding.code_snippet || finding.vulnerable_line)}</div>
                                    </div>` : ''}

                                    ${finding.fix_suggestion ? `
                                    <div class="fix-suggestion">
                                        <strong>💡 Рекомендация:</strong> ${escapeHtml(finding.fix_suggestion)}
                                    </div>` : ''}

                                    ${finding.rule_id || finding.rule_url || finding.file_path ? `
                                    <div class="rule-links">
                                        ${finding.rule_id ? `<strong>📋 Правило:</strong> ${escapeHtml(finding.rule_id)}<br>` : ''}
                                        ${finding.rule_url ? `<a href="${escapeHtml(finding.rule_url)}" target="_blank" class="rule-link">🌐 Внешний источник правила</a><br>` : ''}
                                        ${finding.file_path ? (() => {
                                            const fileUrl = generateRepositoryUrl(window.currentRepoUrl || '', window.branch || 'main', finding.file_path);
                                            return fileUrl ? `<a href="${escapeHtml(fileUrl)}" target="_blank" class="rule-link">📂 Исходный файл: ${escapeHtml(finding.file_path)}</a>` : '';
                                        })() : ''}
                                    </div>` : ''}

                                    ${finding.description || finding.explanation ? `
                                    <div class="finding-details">
                                        <strong>📝 Описание:</strong> ${escapeHtml(finding.description || finding.explanation)}
                                    </div>` : ''}
                                </div>
                            `;
                        });
                        reportHtml += `</div>`;
                    }
                }
            } else {
                reportHtml += `<p class="no-findings">✅ Нет найденных проблем безопасности</p>`;
            }

            reportHtml += `
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="downloadReport('${auditId}', '${escapeHtml(statusData.repo_url)}')">📥 Скачать JSON</button>
                    <button class="btn btn-secondary" onclick="closeReportModal()">❌ Закрыть</button>
                </div>
            `;

            reportContent.innerHTML = reportHtml;
            reportModal.classList.add('active');

            window.currentReportData = { auditId, statusData, reportData, findings };
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function downloadReport(auditId, repoUrl) {
            if (!window.currentReportData) {
                alert('Отчёт недоступен для скачивания');
                return;
            }

            const { statusData, reportData, findings } = window.currentReportData;
            const report = {
                audit_id: auditId,
                repo_url: repoUrl,
                status: statusData.status,
                created_at: statusData.created_at,
                total_findings: findings?.length || 0,
                findings: findings || [],
                raw_api_response: reportData,
                generated_at: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `audit-report-${auditId}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function closeReportModal() {
            const reportModal = document.getElementById('reportModal');
            reportModal.classList.remove('active');
            reportModal.style.display = 'none';
        }

        console.log('Dashboard initialization...');
        const token = getToken();
        console.log('Token from localStorage:', !!token);
        console.log('Token length:', token ? token.length : 0);
        console.log('Token first 50 chars:', token ? token.substring(0, 50) : 'null');

        const user = getUserInfo();
        console.log('User info result:', user);

        if (!user) {
            console.error('No user info found, redirecting to login');
            try {
                const parts = token.split('.');
                console.log('Token parts:', parts.length);
                if (parts.length >= 2) {
                    const payload = parts[1];
                    console.log('Payload first 50 chars:', payload.substring(0, 50));

                    try {
                        const decoded1 = atob(payload.substring(0, 50));
                        console.log('Partial decode attempt 1:', decoded1);
                    } catch(e) {
                        console.log('Decode attempt 1 failed:', e.message);
                    }

                    try {
                        const padding = 4 - payload.length % 4;
                        const paddedPayload = payload + (padding !== 4 ? '='.repeat(padding) : '');
                        const decoded2 = atob(paddedPayload.substring(0, 50));
                        console.log('Partial decode attempt 2 (with padding):', decoded2);
                    } catch(e) {
                        console.log('Decode attempt 2 (with padding) failed:', e.message);
                    }
                }
            } catch(e) {
                console.log('Error during token analysis:', e);
            }

            document.body.innerHTML = '<h1>❌ Ошибка авторизации</h1><p>Не удалось получить информацию пользователя из токена</p>' +
                '<p>Token: ' + (token ? token.substring(0, 50) + '...' : 'null') + '</p>' +
                '<p>Проверьте консоль браузера (F12) для детальной информации</p>' +
                '<a href="/login">Перейти на страницу входа</a>';
            setTimeout(() => {
                window.location.href = '/login';
            }, 10000);
        } else {
            console.log('User authorized:', user.sub);
            currentUser = user;
            document.getElementById('userInfo').textContent = user.sub;
            loadAudits();
        }
    </script>
